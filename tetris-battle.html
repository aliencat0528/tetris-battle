<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Battle - 俄罗斯方块对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .game-container {
            display: flex;
            gap: 40px;
            padding: 20px;
        }

        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .player-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .player1-title {
            color: #4facfe;
        }

        .player2-title {
            color: #fa709a;
        }

        .game-board {
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: #000;
        }

        .info-panel {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
        }

        .info-item {
            margin: 10px 0;
            font-size: 18px;
        }

        .info-label {
            font-weight: bold;
            margin-right: 10px;
        }

        .next-piece-canvas {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            margin-top: 10px;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
        }

        .controls h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .control-group {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            gap: 30px;
        }

        .control-set {
            text-align: left;
        }

        .control-set h4 {
            margin-bottom: 8px;
            color: #ffd700;
        }

        .control-item {
            margin: 5px 0;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-over-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .game-over-content h2 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .winner-text {
            font-size: 32px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="player-section">
            <div class="player-title player1-title">玩家 1</div>
            <canvas id="canvas1" class="game-board" width="240" height="480"></canvas>
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">分数:</span>
                    <span id="score1">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">等级:</span>
                    <span id="level1">1</span>
                </div>
                <div class="info-item">
                    <span class="info-label">消除:</span>
                    <span id="lines1">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">下一个:</span>
                </div>
                <canvas id="next1" class="next-piece-canvas" width="80" height="80"></canvas>
            </div>
        </div>

        <div class="player-section">
            <div class="player-title player2-title">玩家 2</div>
            <canvas id="canvas2" class="game-board" width="240" height="480"></canvas>
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">分数:</span>
                    <span id="score2">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">等级:</span>
                    <span id="level2">1</span>
                </div>
                <div class="info-item">
                    <span class="info-label">消除:</span>
                    <span id="lines2">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">下一个:</span>
                </div>
                <canvas id="next2" class="next-piece-canvas" width="80" height="80"></canvas>
            </div>
        </div>
    </div>

    <div class="controls">
        <h3>游戏控制</h3>
        <div class="control-group">
            <div class="control-set">
                <h4>玩家 1 (WASD)</h4>
                <div class="control-item">← A: 左移</div>
                <div class="control-item">→ D: 右移</div>
                <div class="control-item">↓ S: 快速下落</div>
                <div class="control-item">↑ W: 旋转</div>
                <div class="control-item">Space: 瞬间下落</div>
            </div>
            <div class="control-set">
                <h4>玩家 2 (方向键)</h4>
                <div class="control-item">← 左箭头: 左移</div>
                <div class="control-item">→ 右箭头: 右移</div>
                <div class="control-item">↓ 下箭头: 快速下落</div>
                <div class="control-item">↑ 上箭头: 旋转</div>
                <div class="control-item">Enter: 瞬间下落</div>
            </div>
        </div>
        <div>
            <button class="btn" onclick="startGame()">开始游戏</button>
            <button class="btn" onclick="pauseGame()">暂停/继续</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2>游戏结束!</h2>
            <div class="winner-text" id="winnerText"></div>
            <button class="btn" onclick="resetGame()">再来一局</button>
        </div>
    </div>

    <script src="tetris-battle.js"></script>
</body>
</html>
